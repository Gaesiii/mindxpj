[project]
name = "mindx-attendance-demo"
version = "1.4.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asgiref==3.12.1",
  "colorama==0.4.6",
  "Django==5.2.18",
  "et_xmlfile==2.0.0",
  "openpyxl==3.1.5",
  "pillow==12.3.0",
  "qrcode==8.2",
  "sqlparse==0.6.0",
  "tzdata==2026.5",
  "numpy==2.2.6",
  "opencv-contrib-python-headless==4.13.0.92",
]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python build_vercel.py"
